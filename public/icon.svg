<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#15803d" />
      <stop offset="100%" stop-color="#052e16" />
    </linearGradient>
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Road crossing stripes background effect -->
  <rect x="80" y="410" width="80" height="24" rx="10" fill="#ffffff" opacity="0.25" />
  <rect x="216" y="410" width="80" height="24" rx="10" fill="#ffffff" opacity="0.25" />
  <rect x="352" y="410" width="80" height="24" rx="10" fill="#ffffff" opacity="0.25" />

  <!-- Chicken Character Group -->
  <g filter="url(#shadow)">
    <!-- Shadow beneath chicken -->
    <ellipse cx="256" cy="380" rx="120" ry="32" fill="#000000" opacity="0.3" />

    <!-- Red Comb -->
    <rect x="226" y="100" width="60" height="60" rx="18" fill="#ef4444" />
    <circle cx="216" cy="130" r="22" fill="#dc2626" />
    <circle cx="296" cy="130" r="22" fill="#dc2626" />

    <!-- Body -->
    <rect x="166" y="140" width="180" height="190" rx="44" fill="url(#bodyGrad)" />

    <!-- Wings (left & right) -->
    <rect x="142" y="210" width="28" height="80" rx="14" fill="#94a3b8" />
    <rect x="342" y="210" width="28" height="80" rx="14" fill="#94a3b8" />

    <!-- Eyes -->
    <circle cx="216" cy="200" r="14" fill="#0f172a" />
    <circle cx="212" cy="196" r="4" fill="#ffffff" />
    <circle cx="296" cy="200" r="14" fill="#0f172a" />
    <circle cx="292" cy="196" r="4" fill="#ffffff" />

    <!-- Beak -->
    <polygon points="230,224 282,224 256,264" fill="#f59e0b" />
    <polygon points="238,224 274,224 256,252" fill="#fbbf24" />

    <!-- Wattle -->
    <circle cx="256" cy="276" r="12" fill="#ef4444" />

    <!-- Feet -->
    <rect x="206" y="324" width="20" height="34" rx="8" fill="#f59e0b" />
    <rect x="286" y="324" width="20" height="34" rx="8" fill="#f59e0b" />
  </g>
</svg>
